# --- OIDC: this app is a confidential client of OUR Keycloak (realm "acme") -------------
# The app never talks to Entra directly; Keycloak brokers the login.
# Discovery goes over the docker network; Keycloak (KC_HOSTNAME) still hands the browser
# localhost:18080 URLs and issues tokens with iss=http://localhost:18080/realms/acme.
quarkus.oidc.auth-server-url=${KC_URL:http://keycloak:8080/realms/acme}
quarkus.oidc.client-id=${CLIENT_ID:backoffice-demo}
quarkus.oidc.credentials.secret=${CLIENT_SECRET:backoffice-demo-secret}
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.scopes=profile,email
quarkus.oidc.authentication.redirect-path=/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
# Skip Keycloak's own login page and go straight to the corporate IdP
quarkus.oidc.authentication.extra-params.kc_idp_hint=${IDP_HINT:entra}

# Roles come from the access token (realm roles inherited from Keycloak groups)
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.roles.role-claim-path=realm_access/roles

# RP-initiated logout: app -> Keycloak -> Entra
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/

# Every page requires a corporate login
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

quarkus.http.port=8080

# Frontend bundle is built by vaadin-maven-plugin (-Pproduction), not by the Quarkus extension
vaadin.build.enabled=false
